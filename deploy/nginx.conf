# frontend 서버(EC2): 화면 서빙과 /api 프록시
# 설치 위치: /etc/nginx/conf.d/lunch.conf
# 기본 server 블록(/etc/nginx/nginx.conf의 listen 80)은 주석 처리해서 이 파일이 80번을 쓰게 한다.
# 화면 파일: `npm run build`의 frontend/dist 내용을 /var/www/lunch 에 복사한다.
server {
    listen 80 default_server;
    server_name _;

    root /var/www/lunch;
    index index.html;

    # 백엔드 서버(사설 IP)로 넘긴다. 브라우저는 이 서버 주소만 쓰므로 CORS가 필요 없다.
    location /api/ {
        proxy_pass http://10.10.20.20:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
